name: Build Alpine ISO

on:
  push:
    tags:
      - 'v*'

jobs:
  build-iso:
    runs-on: ubuntu-24.04

    env:
      GO_VERSION: "1.24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          # Install Trivy
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

          # Install govulncheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify Go dependencies
        run: |
          go mod tidy
          go mod verify

      - name: Scan source before build
        run: |
          govulncheck ./...
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .

      - name: Generate SBOM (source tree)
        run: |
          trivy fs \
            --format cyclonedx \
            --output sbom-source.cdx.json \
            .

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o rmstool .

      - name: Scan built binary
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            ./rmstool

      - name: Generate SBOM (binary)
        run: |
          trivy fs \
            --format cyclonedx \
            --output sbom-binary.cdx.json \
            ./rmstool

      - name: Copy binary into Docker build context
        run: |
          cp rmstool isobuild/rmstool
          chmod +x isobuild/rmstool

      - name: Build ISO builder image
        run: |
          cd isobuild
          docker build -t alpine-iso-builder .

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Run ISO build in container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/artifacts:/iso" \
            alpine-iso-builder
          mv artifacts/alpine-helper_kvm-v3.22-x86_64.iso artifacts/rivermeadow-helper-${{ github.ref_name }}.iso

      - name: Verify ISO output
        run: |
          ls -lah artifacts
          find artifacts -type f -name "*.iso"

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum *.iso > SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            artifacts/*.iso
            artifacts/SHA256SUMS.txt
            sbom-source.cdx.json
            sbom-binary.cdx.json